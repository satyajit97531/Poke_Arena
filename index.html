<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéSilhouette Quiz</title>
    <meta name="description" content="Guess Pokémon from silhouettes, half-bodies, close-ups, cries, moves, and evolution lines across all regions and forms. Features 1v1 QR duel mode, customizable profiles, limitless trophies, and unlockable BGM." />
    <meta property="og:title" content="PokéSilhouette Quiz" />
    <meta property="og:description" content="Guess Pokémon from silhouettes, half-bodies, close-ups, cries, moves, and evolution lines across all regions and forms. Features 1v1 QR duel mode, customizable profiles, limitless trophies, and unlockable BGM." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: 'Outfit', sans-serif;">
        <style>
          @keyframes pokeball-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes pulse-ring {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 0.9; transform: scale(1.05); }
          }
          .pokeball-loader {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid #0f172a;
            position: relative;
            background: linear-gradient(to bottom, #ef4444 0%, #ef4444 48%, #0f172a 48%, #0f172a 52%, #ffffff 52%, #ffffff 100%);
            animation: pokeball-spin 0.8s linear infinite;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
          }
          .pokeball-loader::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border: 4px solid #0f172a;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
          }
        </style>
        <div class="pokeball-loader"></div>
        <div style="margin-top: 24px; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; font-family: 'Chakra Petch', sans-serif;">INITIALIZING POKÉMON ARENA...</div>
        <div style="margin-top: 8px; font-size: 12px; color: #94a3b8;">Loading Pokédex Database & Assets...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
